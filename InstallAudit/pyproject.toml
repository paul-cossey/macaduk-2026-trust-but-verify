[project]
name = "install-audit"
version = "1.0.0"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
  | src/utils/scratch
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
known_first_party = ["src"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pylint.main]
# Maximum number of characters on a single line
max-line-length = 120

# Good variable names which should always be accepted
good-names = ["i", "j", "k", "ex", "Run", "_", "f", "e", "id"]

# Ignore paths
ignore-paths = [
    "^src/utils/scratch/.*$",
    "^__pycache__/.*$"
]

[tool.pylint.messages_control]
# Disable specific pylint messages that conflict with project style
disable = [
    "C0103",  # invalid-name (some legacy naming patterns)
    "C0114",  # missing-module-docstring (not all modules need docstrings)
    "C0115",  # missing-class-docstring (many classes have adequate comments)
    "C0116",  # missing-function-docstring (many functions are self-explanatory)
    "R0913",  # too-many-arguments (some functions legitimately need many args)
    "R0914",  # too-many-locals (will be addressed through refactoring)
    "W0703",  # broad-except (intentional for robustness in some cases)
    "R0912",  # too-many-branches (will be addressed through refactoring)
    "R0915",  # too-many-statements (will be addressed through refactoring)
]

[tool.pylint.design]
# Maximum complexity for function / method body
max-complexity = 15

# Maximum number of arguments for function / method
max-args = 7

# Maximum number of locals for function / method body
max-locals = 20

# Maximum number of return / yield for function / method body
max-returns = 6

# Maximum number of branch for function / method body
max-branches = 15

# Maximum number of statements in function / method body
max-statements = 60

[tool.pylint.format]
# Maximum number of lines in a module
max-module-lines = 1500

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[[tool.mypy.overrides]]
module = "src.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/scratch/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
